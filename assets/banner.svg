  <style>
    @font-face { font-family: "New Rocker"; src: url(data:font/woff2;base64,) format("woff2"); }
    @font-face { font-family: "Josefin Sans"; font-weight: 600; src: url(data:font/woff2;base64,) format("woff2"); }
    .nome { font-family: "New Rocker", serif; font-size: 112px; fill: #F4EDE4; }
    .apoio { font-family: "Josefin Sans", sans-serif; font-weight: 600; font-size: 22px; letter-spacing: 6px; fill: #A98BFF; }
    .assinatura { font-family: "Josefin Sans", sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 4px; fill: #BEB2DA; }
    .ceu circle { fill: #E9E1FF; }
    .pisca { animation: piscar 4s ease-in-out infinite; }
    .brilho { animation: brilhar 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    @keyframes piscar { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes brilhar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
    @media (prefers-reduced-motion: reduce) { .pisca, .brilho, .cometa { animation: none; } }
  </style>
